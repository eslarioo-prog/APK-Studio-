{
  "tasks": {
    "start": "deno run main.ts",
    "lint": "deno lint",
    "check": "deno check **/*.ts **/*.tsx"
  },
  "compilerOptions": {
    "jsx": "react-jsx",
    "jsxImportSource": "preact"
  },
  "lint": {
    "include": ["src/"],
    "exclude": ["dist/", "coverage/"],
    "rules": {
      "tags": ["recommended"],
      "exclude": [
        "no-explicit-any"
      ]
    }
  },
  "fmt": {
    "useTabs": false,
    "lineWidth": 80,
    "indentWidth": 2,
    "semiColons": true,
    "singleQuote": true
  }
}
